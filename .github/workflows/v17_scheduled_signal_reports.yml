name: V17 Scheduled Signal Reports

on:
  schedule:
    # Saturday 10:00 AM Singapore time
    - cron: "0 10 * * 6"
      timezone: "Asia/Singapore"

    # Tuesday 9:32 PM Singapore time
    - cron: "32 21 * * 2"
      timezone: "Asia/Singapore"

  workflow_dispatch:
    inputs:
      run_type:
        description: "Which command to run manually"
        required: true
        default: "offline_check"
        type: choice
        options:
          - saturday_signal
          - tuesday_active
          - offline_check

concurrency:
  group: v17-signal-reports
  cancel-in-progress: false

jobs:
  run-v17:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # If your repo root is spy_v17_modded, keep this as "."
      # If your repo root contains the outer folder, change to:
      # spy_v17_production/spy_v17_modded
      WORKING_DIR: "."

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set run label
        id: label
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_type=${{ github.event.inputs.run_type }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "0 10 * * 6" ]]; then
            echo "run_type=saturday_signal" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "32 21 * * 2" ]]; then
            echo "run_type=tuesday_active" >> "$GITHUB_OUTPUT"
          else
            echo "run_type=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "${{ env.WORKING_DIR }}/requirements.txt"

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V17 command and capture terminal output
        id: run_model
        working-directory: ${{ env.WORKING_DIR }}
        shell: bash
        run: |
          set +e

          echo "V17 scheduled run" | tee terminal_output.txt
          echo "Run type: ${{ steps.label.outputs.run_type }}" | tee -a terminal_output.txt
          echo "Timestamp UTC: $(date -u)" | tee -a terminal_output.txt
          echo "--------------------------------------------------" | tee -a terminal_output.txt

          if [[ "${{ steps.label.outputs.run_type }}" == "offline_check" ]]; then
            python spy_v17_conservative.py --mode signal --offline 2>&1 | tee -a terminal_output.txt
          else
            python spy_v17_conservative.py --mode signal --refresh-data --live-track 2>&1 | tee -a terminal_output.txt
          fi

          status=${PIPESTATUS[0]}
          echo "--------------------------------------------------" | tee -a terminal_output.txt
          echo "Exit code: $status" | tee -a terminal_output.txt

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload terminal output backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-terminal-output-${{ steps.label.outputs.run_type }}
          path: ${{ env.WORKING_DIR }}/terminal_output.txt
          retention-days: 30

      - name: Send terminal output to Telegram
        if: always()
        working-directory: ${{ env.WORKING_DIR }}
        shell: bash
        run: |
          caption="V17 ${{ steps.label.outputs.run_type }} | exit code ${{ steps.run_model.outputs.exit_code }}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F document="@terminal_output.txt" \
            -F caption="$caption"

      - name: Fail workflow if model failed
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.run_model.outputs.exit_code }}" != "0" ]]; then
            exit 1
          fi
