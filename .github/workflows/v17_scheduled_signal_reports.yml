name: V17 Signal Reports

on:
  # Backup cron schedule (runs even if Cloudflare Worker is down)
  schedule:
    # Saturday 9:00 AM Singapore time = 01:00 UTC Saturday
    - cron: "0 1 * * 6"
    # Tuesday 9:32 PM Singapore time = 13:32 UTC Tuesday
    - cron: "32 13 * * 2"

  workflow_dispatch:
    inputs:
      run_type:
        description: "Which command to run"
        required: true
        default: "offline_check"
        type: choice
        options:
          - saturday_signal
          - tuesday_active
          - offline_check
          - send_signal
          - capital_inject
      inject_amount:
        description: "Capital injection amount (capital_inject only)"
        required: false
        default: ""
        type: string
      inject_date:
        description: "Capital injection date YYYY-MM-DD (capital_inject only)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: v17-signal-reports
  cancel-in-progress: false

jobs:
  run-v17:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      WORKING_DIR: "."

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Determine run_type from either workflow_dispatch input or cron schedule
      - name: Set run label
        id: label
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_type=${{ github.event.inputs.run_type }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "0 1 * * 6" ]]; then
            echo "run_type=saturday_signal" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "32 13 * * 2" ]]; then
            echo "run_type=tuesday_active" >> "$GITHUB_OUTPUT"
          else
            echo "run_type=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "${{ env.WORKING_DIR }}/requirements.txt"

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------------------------------------------------
      # Run the model. Each run_type is handled here:
      #   saturday_signal / tuesday_active — full signal + live-track (Telegram: file)
      #   offline_check                    — signal --offline            (Telegram: file)
      #   send_signal                      — tg_send_signal.py          (Telegram: inline text, self-handled)
      #   capital_inject                   — inject_capital.py          (Telegram: self-handled, own git commit)
      # -----------------------------------------------------------------------
      - name: Run V17 command and capture terminal output
        id: run_model
        working-directory: ${{ env.WORKING_DIR }}
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INJECT_AMOUNT: ${{ github.event.inputs.inject_amount }}
          INJECT_DATE: ${{ github.event.inputs.inject_date }}
        run: |
          set +e

          run_type="${{ steps.label.outputs.run_type }}"

          echo "V17 signal run" | tee terminal_output.txt
          echo "Run type: $run_type" | tee -a terminal_output.txt
          echo "Timestamp UTC: $(date -u)" | tee -a terminal_output.txt
          echo "Timestamp Singapore: $(TZ=Asia/Singapore date)" | tee -a terminal_output.txt
          echo "----------------------------------------------------" | tee -a terminal_output.txt

          tg_send_error() {
            local msg="$1"
            echo "ERROR: $msg" | tee -a terminal_output.txt
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="V17 Actions ERROR: $msg" || true
          }

          if [[ "$run_type" == "offline_check" ]]; then
            python spy_v17_conservative.py --mode signal --offline 2>&1 | tee -a terminal_output.txt

          elif [[ "$run_type" == "send_signal" ]]; then
            if [[ ! -f "tg_send_signal.py" ]]; then
              tg_send_error "tg_send_signal.py not found in repo. Push the file to GitHub."
              exit 2
            fi
            python tg_send_signal.py 2>&1 | tee -a terminal_output.txt

          elif [[ "$run_type" == "capital_inject" ]]; then
            if [[ ! -f "inject_capital.py" ]]; then
              tg_send_error "inject_capital.py not found in repo. Push the file to GitHub."
              exit 2
            fi
            python inject_capital.py 2>&1 | tee -a terminal_output.txt

          else
            # saturday_signal, tuesday_active, and any unknown fallback
            python spy_v17_conservative.py --mode signal --refresh-data --live-track 2>&1 | tee -a terminal_output.txt
          fi

          status=${PIPESTATUS[0]}
          echo "----------------------------------------------------" | tee -a terminal_output.txt
          echo "Exit code: $status" | tee -a terminal_output.txt

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      # Always save the raw log as a downloadable artifact for debugging
      - name: Save terminal output backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-terminal-output-${{ steps.label.outputs.run_type }}
          path: ${{ env.WORKING_DIR }}/terminal_output.txt
          retention-days: 30

      # Commit live_tracker + outputs back to repo.
      # Skipped for capital_inject because inject_capital.py handles its own commits.
      - name: Commit live tracker/output changes back to repo
        if: always() && github.event.inputs.run_type != 'capital_inject'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cd "${{ env.WORKING_DIR }}"

          [[ -d "live_tracker" ]] && git add live_tracker || true
          [[ -d "outputs_v17_conservative" ]] && git add outputs_v17_conservative || true

          if git diff --cached --quiet; then
            echo "No live tracker/output changes to commit."
          else
            git commit -m "Update V17 live tracker/output"
            git push
          fi

      # Send terminal_output.txt as a Telegram document (the full log file).
      # Skipped for send_signal  (tg_send_signal.py already sent inline text).
      # Skipped for capital_inject (inject_capital.py already sent its own messages).
      - name: Send terminal output to Telegram
        if: always() && github.event.inputs.run_type != 'send_signal' && github.event.inputs.run_type != 'capital_inject'
        working-directory: ${{ env.WORKING_DIR }}
        shell: bash
        run: |
          run_type="${{ steps.label.outputs.run_type }}"
          exit_code="${{ steps.run_model.outputs.exit_code }}"

          if [[ "$run_type" == "saturday_signal" ]]; then
            intro_msg="Sending over V17 Saturday signal now."
          elif [[ "$run_type" == "tuesday_active" ]]; then
            intro_msg="Sending over V17 Tuesday ACTIVE signal now."
          elif [[ "$run_type" == "offline_check" ]]; then
            intro_msg="Sending over V17 offline signal check now."
          else
            intro_msg="Sending over V17 signal report now."
          fi

          caption="V17 $run_type | exit code $exit_code"

          echo "Checking Telegram secrets..."
          if [[ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is missing in GitHub repo secrets"
            exit 1
          fi

          if [[ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]]; then
            echo "ERROR: TELEGRAM_CHAT_ID is missing in GitHub repo secrets"
            exit 1
          fi

          intro_response=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$intro_msg")

          echo "Intro Telegram response:"
          echo "$intro_response"
          echo "$intro_response" | grep '"ok":true'

          if [[ ! -f "terminal_output.txt" ]]; then
            response=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="V17 workflow ran but terminal_output.txt was not created. Check GitHub Actions logs.")
            echo "$response"
            echo "$response" | grep '"ok":true'
            exit $?
          fi

          response=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F document="@terminal_output.txt" \
            -F caption="$caption")

          echo "Telegram response:"
          echo "$response"
          echo "$response" | grep '"ok":true'

      - name: Fail workflow if model failed
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.run_model.outputs.exit_code }}" != "0" ]]; then
            exit 1
          fi
